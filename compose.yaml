services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - php
    volumes:
      - uploads:/var/www/html/public/storage:ro
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      APP_DEBUG: "false"
      DATABASE_TYPE: mysql
      DATABASE_HOSTNAME: mysql
      DATABASE_DATABASE: "${MYSQL_DATABASE:-cms}"
      DATABASE_USERNAME: "${MYSQL_USER:-cms_app}"
      DATABASE_PASSWORD: "${MYSQL_PASSWORD}"
      DATABASE_HOSTPORT: "3306"
      DATABASE_CHARSET: utf8mb4
      DATABASE_PREFIX: think_
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads:/var/www/html/public/storage
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-cms}"
      MYSQL_USER: "${MYSQL_USER:-cms_app}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      TZ: Asia/Tokyo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
volumes:
  mysql_data:
  uploads:
